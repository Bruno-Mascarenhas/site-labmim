<link rel="icon" href="{{FAVICON}}" />

<!-- Bootstrap 5.3.8, vendored locally — no CDN on the critical path.
     PURGED build: only the selectors the site uses (~27KB instead of 232KB).
     The full bootstrap.min.css stays next to it, and `npm run lint:purge`
     reports when a new class needs a regeneration (scripts/purgecss.config.cjs). -->
<link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.purged.min.css" />

<!-- Font Awesome 6.4.0, vendored locally. The preload breaks the
     HTML -> CSS -> font chain: every page uses solid icons and the font is
     font-display:block (icons invisible until it loads). crossorigin is
     mandatory on a font preload, even same-origin, or it downloads twice. -->
<link
  rel="preload"
  href="assets/vendor/fontawesome/webfonts/fa-solid-900.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css?v=6.4.0" />
